name: build-r11-xnu

# 在 GitHub 的 macOS runner 上编译 XNU 内核并打包 UniXNU payload。
# 产出：kernel.macho、kernel.macho.adt、payload.img（Artifacts 里下载）

on:
  workflow_dispatch:        # 手动触发（网页上点 Run workflow）

jobs:
  build:
    runs-on: macos-15       # Xcode 16：clang 支持 mig 用的 -mach_msg2
    timeout-minutes: 240

    steps:
      - name: 取出设备仓库（unixnu-r11）
        uses: actions/checkout@v4
        with:
          path: device

      - name: 取出 UniXNU 主仓库（固定 commit，避免上游更新导致补丁不适用）
        run: |
          git clone https://github.com/UniXNU/UniXNU.git UniXNU
          cd UniXNU
          git checkout e88eaf95c9e8aab75bf93b7380fb68ea92f130e4
          git log --oneline -1

      - name: 缓存源码与编译对象
        uses: actions/cache@v4
        with:
          path: |
            UniXNU/out/feeds
            UniXNU/out/r11/tree/.cache
            UniXNU/out/r11/tree/build
          key: r11b-${{ hashFiles('device/board.toml', 'device/configs/r11_defconfig', 'device/scripts/*.py') }}-${{ github.run_id }}
          restore-keys: |
            r11b-${{ hashFiles('device/board.toml', 'device/configs/r11_defconfig', 'device/scripts/*.py') }}-
            r11b-

      - name: 安装依赖
        run: |
          brew install cmake ninja unifdef lld mtools || true
          xcodebuild -version
          clang --version | head -1

      - name: 拉取 XNU 等源码
        working-directory: UniXNU
        run: ./unixnu fetch -D ../device

      - name: 预生成 DriverKit 头文件缓存（绕过 GitHub API 限流）
        run: python3 device/scripts/preseed-driverkit.py UniXNU/out/r11/tree

      - name: 选择配置
        working-directory: UniXNU
        run: ./unixnu defconfig r11_defconfig -D ../device

      - name: 编译 R11 桩归档（UFS 存储桩）
        run: |
          set -euo pipefail
          STUB=UniXNU/out/r11/tree/build/r11-stubs
          mkdir -p "$STUB"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -target arm64-apple-ios17.0 -isysroot "$SDK" -O2 -nostdinc \
            -I "$SDK/usr/include" -c device/package/r11-stubs/ufs-store-stubs.c -o "$STUB/ufs-store-stubs.o"
          xcrun ar rcs "$STUB/libR11Stubs.a" "$STUB/ufs-store-stubs.o"
          nm "$STUB/libR11Stubs.a" | head -8

      - name: 修补 NativeAES bindings 脚本（上游缺少 mkdir 与对象拷贝）
        run: python3 device/scripts/fix-native-aes-bindings.py UniXNU/scripts/build-native-aes-bindings.py

      - name: 把 NativeSdhci 接入构建脚本
        working-directory: UniXNU
        run: python3 ../device/scripts/patch-tree-for-sdhci.py

      # NativeRamBlock 的归档要引用 IOBlockStorageDevice 的 15 个符号，必须靠 `.set`
      # 绑定到原版 kext 被 slide 后的绝对地址。绑定地址来自审计，而审计需要一份
      # prelink 候选（输入是上一次成功编译出来的 noctf）。所以这一步要排在编译内核之前，
      # 靠缓存里的 noctf 干活；冷缓存（第一次跑 / 缓存被清）时它会跳过并失败，
      # 此时内核链接会因缺符号失败 —— 再跑一次即恢复正常。
      - name: 生成 RamBlock 的 IOStorageFamily 绑定（审计 + .set）
        continue-on-error: true
        run: |
          set -e
          # 先把装配树铺出来：kits/（emit_prelink.py）与 scripts/（审计、绑定）都在里面，
          # 而本步骤排在编译内核之前，不能指望 build 自己刚铺过。
          ( cd UniXNU && ./unixnu tree -D ../device 2>&1 | tail -20 )
          python3 device/scripts/make-ramblock-bindings.py UniXNU device/board.toml 2>&1 | tee /tmp/ramblock.log | tail -40
          echo "== ramblock.log =="; wc -l /tmp/ramblock.log

      - name: 编译内核（耗时最长）
        working-directory: UniXNU
        # macos-15 的 arm64 runner 只有 3 核 / 7 GB 内存，-j4 在链接 54 MB 内核时
        # 容易把 runner 打爆（表现为进程收到 SIGTERM、exit code 143、日志全空）。
        # 这里限成 -j2，并给这一步单独的超时，好把"步骤超时"和"runner 被杀"区分开。
        timeout-minutes: 150
        env:
          JOBS: 2
        run: |
          set -o pipefail
          echo "== runner =="; sw_vers; sysctl -n hw.ncpu hw.memsize
          df -h / /tmp | sed -n '1,4p'
          ./unixnu build -D ../device kernel package 2>&1 | tee /tmp/kernel.log | tail -50
          echo "== 构建结束，log 大小 =="; wc -l /tmp/kernel.log

      - name: 导出内核符号（给 payload 补丁按符号定位）
        if: success()
        run: |
          set -e
          NM=$(xcrun -f llvm-nm)
          K=UniXNU/out/r11/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf
          ls -l "$K"
          mkdir -p UniXNU/out/r11/kernel
          "$NM" --defined-only "$K" | awk 'NF>=3 {print $1, $2, $3}' > UniXNU/out/r11/kernel/kernel-symbols.txt
          wc -l UniXNU/out/r11/kernel/kernel-symbols.txt
          grep -E ' (_initialize_screen|_gc_enable)$' UniXNU/out/r11/kernel/kernel-symbols.txt || true

      - name: 把内核日志写进任务摘要
        if: always()
        run: |
          {
            echo '### kernel.log（末尾 200 行）'
            echo '```'
            tail -200 /tmp/kernel.log 2>/dev/null || echo '(没有 /tmp/kernel.log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 诊断（失败时重跑内核构建，输出完整 stderr）
        if: failure()
        working-directory: UniXNU/out/r11/tree
        continue-on-error: true
        run: |
          echo "==== 上一次 kernel.log 的末尾（runner 被杀时这里是唯一线索）===="
          wc -l /tmp/kernel.log 2>/dev/null || echo "(kernel.log 不存在：说明 unixnu 还没打印任何东西就被杀了)"
          tail -100 /tmp/kernel.log 2>/dev/null || true
          {
            echo '### 失败现场'
            echo '```'
            tail -100 /tmp/kernel.log 2>/dev/null || echo '(kernel.log 不存在)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "==== 重跑 build-xnu-4k-baseline.sh，捕获完整输出 ===="
          JOBS=2 bash scripts/build-xnu-4k-baseline.sh > /tmp/diag.log 2>&1 || true
          echo "---- 最后的错误相关行 ----"
          grep -n -i -E 'error|undefined|no rule|not found|ld: |clang: ' /tmp/diag.log | tail -60 || true
          echo "---- 末尾 120 行 ----"
          tail -120 /tmp/diag.log || true

      # 种子只用于「APFS Data 根卷」这条支线。存储探测（NativeSdhci）不依赖它，
      # 所以这一步失败绝不能拦住内核产物 —— 用 continue-on-error 把失败降级为警告。
      - name: 生成最小 Data 种子（APFS，跳过 Setup）
        id: seed
        continue-on-error: true
        working-directory: device
        run: |
          bash scripts/make-data-seed.sh "$RUNNER_TEMP/seed.dbr" 32 2>&1 | tee /tmp/seed.log | tail -30
          ls -l "$RUNNER_TEMP"/seed.dbr.*

      - name: 把 Data seed 的 UUID 写进 board.toml
        working-directory: device
        run: |
          if [ ! -f "$RUNNER_TEMP/seed.dbr.uuid" ]; then
            echo "没有种子 UUID，跳过（payload 将不带 data-ramdisk）"
            exit 0
          fi
          UUID="$(cat "$RUNNER_TEMP/seed.dbr.uuid")"
          echo "seed UUID = $UUID"
          python3 - "$UUID" <<'PY'
          import re, sys
          from pathlib import Path
          uuid = sys.argv[1].strip()
          p = Path('board.toml')
          s = p.read_text()
          s2 = re.sub(r'root_match_volume_uuid\s*=\s*"[^"]*"',
                      'root_match_volume_uuid = "%s"' % uuid, s, count=1)
          p.write_text(s2)
          print('board.toml 已更新')
          PY
          grep -n 'root_match_volume_uuid' board.toml

      - name: 打包 payload（需要设备唯一 ID）
        working-directory: UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          set -o pipefail
          # RamBlock 支线：payload 要带上稠密 raw 的 Data 镜像（.raw），ADT 用
          # --data-ramdisk 声明它 → UniXNU 往 /chosen/memory-map 写 RAMDisk →
          # 内核里的 NativeRamBlock 把它发布成块设备 → IOMedia → APFS 根卷。
          # 注意不能用 --skip-setup（那个工具只认 DBRDISK1 打包件），所以种子里的
          # Setup 状态由 make-data-seed.sh 自己写好（com.apple.purplebuddy.plist）。
          SEED="$RUNNER_TEMP/seed.dbr.raw"
          # 注意：runner 的 /bin/bash 是 3.2，set -u 下空数组展开会报
          # "unbound variable"，所以用字符串而不是数组拼参数。
          SEED_ARG=""
          if [ -f "$SEED" ]; then
            SEED_ARG="--data-ramdisk $SEED"
            ls -l "$SEED"
          else
            echo "::warning::没有 $SEED，payload 将不带 Data 镜像（NativeRamBlock 无法上线）"
          fi
          ./unixnu build -D ../device payload $SEED_ARG 2>&1 | tee /tmp/payload.log | tail -50

      - name: 失败时也上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-logs
          path: |
            /tmp/kernel.log
            /tmp/payload.log
            /tmp/seed.log
            /tmp/diag.log
            /tmp/ramblock.log
            UniXNU/out/r11/logs/**
          if-no-files-found: ignore

      - name: 上传内核与 payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-boot-artifacts
          path: |
            UniXNU/out/r11/kernel/**
            UniXNU/out/r11/payload/**
            UniXNU/out/r11/boot/**
          if-no-files-found: warn
