name: make-data-seed

# 只做一件事：在 macOS 上生成最小 APFS Data seed 并上传。
# 不编内核、不打包 payload —— 那些在本地做。

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: macos-14
    steps:
      - name: 取出设备仓库
        uses: actions/checkout@v4
        with:
          path: device

      - name: 取出 UniXNU 与 DarwinBoot（packed_ramdisk.py 在 DarwinBoot 子模块里）
        run: |
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU
          git clone --depth 1 https://github.com/UniXNU/DarwinBoot.git UniXNU/drivers/DarwinBoot
          ls UniXNU/drivers/DarwinBoot | head -20

      - name: 生成最小 Data 种子
        run: |
          bash device/scripts/make-data-seed.sh "$RUNNER_TEMP/seed" 32 2>&1 | tee /tmp/seed.log
          echo "---- UUID ----"
          cat "$RUNNER_TEMP/seed.uuid"
          ls -l "$RUNNER_TEMP/seed.raw" "$RUNNER_TEMP/seed.dbr" 2>/dev/null || true

      - name: 上传 seed
        uses: actions/upload-artifact@v4
        with:
          name: r11-data-seed
          path: |
            ${{ runner.temp }}/seed.raw
            ${{ runner.temp }}/seed.dbr
            ${{ runner.temp }}/seed.uuid
            /tmp/seed.log
          if-no-files-found: error
